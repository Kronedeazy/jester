<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-pure: #050505;
      --bg-card: #111113;
      --bg-pill: #1a1a1e;
      --border-soft: #26262c;
      --text-white: #ffffff;
      --text-muted: #a1a1aa;
      --strawberry-pink: #f4a7b9;
      --teal-green: #10b981;
      --soft-purple: #a78bfa;
      --crimson-red: #e11d48;
    }
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    body {
      width: 400px;
      margin: 0;
      padding: 14px;
      background-color: var(--bg-pure);
      color: var(--text-white);
    }
    .container { display: flex; flex-direction: column; gap: 10px; }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px 9px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
    }
    .header img { width: 30px; height: 36px; object-fit: contain; }
    .header-title { display: flex; flex-direction: column; flex: 1; }
    .header-title h3 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: 2px; }
    .header-title span { font-size: 11px; color: var(--strawberry-pink); }
    #demo-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #3f3f46;
      background: var(--bg-pill);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }
    #demo-btn:hover { color: #fff; border-color: var(--strawberry-pink); }
    body.demo #demo-btn { background: var(--strawberry-pink); border-color: var(--strawberry-pink); color: #050505; }

    /* Demo-Modus: Erklaerungen erscheinen direkt unter den Bereichen */
    .explain {
      display: none;
      background: #1c1c22;
      border: 1px solid #3a2a30;
      border-left: 3px solid var(--strawberry-pink);
      border-radius: 12px;
      padding: 8px 11px;
      font-size: 11.5px;
      line-height: 1.5;
      color: #e4e4e7;
    }
    .explain b { color: var(--strawberry-pink); }
    body.demo .explain { display: block; }
    #demo-intro { display: none; }
    body.demo #demo-intro { display: block; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-title {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-pink { background: var(--strawberry-pink); box-shadow: 0 0 8px var(--strawberry-pink); }
    .dot-purple { background: var(--soft-purple); box-shadow: 0 0 8px var(--soft-purple); }
    .dot-teal { background: var(--teal-green); box-shadow: 0 0 8px var(--teal-green); }

    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    button.mode-btn {
      padding: 8px 10px;
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      background: var(--bg-pill);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    button.mode-btn:hover { border-color: #3f3f46; color: var(--text-white); }
    button.mode-btn.active-reader { background: rgba(16,185,129,0.18); border-color: var(--teal-green); color: #fff; box-shadow: 0 0 12px rgba(16,185,129,0.25); }
    button.mode-btn.active-translator { background: rgba(244,167,185,0.20); border-color: var(--strawberry-pink); color: #fff; box-shadow: 0 0 12px rgba(244,167,185,0.25); }
    button.mode-btn.active-translator-audio { background: rgba(167,139,250,0.20); border-color: var(--soft-purple); color: #fff; box-shadow: 0 0 12px rgba(167,139,250,0.25); }
    button.mode-btn.active-off { background: rgba(225,29,72,0.20); border-color: var(--crimson-red); color: #fff; }

    .row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; gap: 8px; }
    .sub-label { color: var(--text-muted); font-size: 11.5px; display: flex; align-items: center; gap: 6px; }
    .val { color: #fff; font-weight: 700; font-size: 11.5px; min-width: 44px; text-align: right; }
    .unit-wrap { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
    .pill-btn {
      background: var(--bg-pill);
      border: 1px solid var(--border-soft);
      color: var(--strawberry-pink);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .pill-btn:hover { border-color: var(--strawberry-pink); }
    input[type="range"] { width: 100%; accent-color: var(--strawberry-pink); cursor: pointer; height: 5px; margin: 0; }
    input[type="range"].purple { accent-color: var(--soft-purple); }
    input[type="number"] {
      width: 54px;
      background: var(--bg-pill);
      border: 1px solid var(--border-soft);
      color: #fff;
      border-radius: 999px;
      text-align: center;
      padding: 3px 6px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }
    input[type="number"]:focus { border-color: var(--strawberry-pink); }

    /* Boost-Stufen: Schieberegler in 1-dB-Schritten */
    .stage-row { display: grid; grid-template-columns: 56px 1fr 52px; align-items: center; gap: 10px; }
    .stage-name { font-size: 10.5px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; }

    .slider-block { display: flex; flex-direction: column; gap: 5px; }
    .hint { color: #71717a; font-size: 11px; }

    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #27272a; transition: .2s; border-radius: 999px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: #fff; transition: .2s; border-radius: 50%; }
    input:checked + .slider.pink { background-color: var(--strawberry-pink); }
    input:checked + .slider.purple { background-color: var(--soft-purple); }
    input:checked + .slider.teal { background-color: var(--teal-green); }
    input:checked + .slider:before { transform: translateX(18px); }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 0 6px;
      font-size: 10.5px;
      color: var(--text-muted);
    }
    .footer strong { color: var(--strawberry-pink); }
    .footer input[type="number"] { width: 46px; padding: 2px 4px; font-size: 11px; }
    .head-btns { display: flex; gap: 6px; flex-shrink: 0; }
    #lang-btn {
      height: 28px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid #3f3f46;
      background: var(--bg-pill);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    #lang-btn:hover { color: #fff; border-color: var(--strawberry-pink); }
    /* Tasten-Bereich: nur im D-Modus sichtbar */
    #keys-card { display: none; }
    body.demo #keys-card { display: flex; }
    .key-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .key-btn {
      min-width: 74px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      border-bottom-width: 3px;
      background: var(--bg-pill);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .key-btn:hover { border-color: var(--strawberry-pink); }
    .key-btn.listening { border-color: var(--strawberry-pink); color: var(--strawberry-pink); }
    .key-fixed { font-size: 11px; color: var(--text-muted); text-align: right; }
    .link-btn { background: none; border: none; color: var(--strawberry-pink); font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icon.png" alt="">
      <div class="header-title">
        <h3>JESTER</h3>
        <span data-i18n="tagline"></span>
      </div>
      <div class="head-btns">
        <button id="lang-btn" data-i18n-title="langTitle">EN</button>
        <button id="demo-btn" data-i18n-title="demoTitle">D</button>
      </div>
    </div>

    <div class="explain" id="demo-intro" data-i18n-html="demoIntro"></div>

    <!-- TASTEN (nur im D-Modus) -->
    <div class="card" id="keys-card">
      <div class="card-header">
        <span class="card-title"><span class="dot dot-pink"></span><span data-i18n="keysTitle"></span></span>
        <button class="pill-btn" id="keys-reset" data-i18n="keysReset"></button>
      </div>
      <div class="key-row"><span class="sub-label" data-i18n="keyBoost"></span><button class="key-btn" data-key="key_boost"></button></div>
      <div class="key-row"><span class="sub-label" data-i18n="keyBack"></span><button class="key-btn" data-key="key_back"></button></div>
      <div class="key-row"><span class="sub-label" data-i18n="keyFwd"></span><button class="key-btn" data-key="key_fwd"></button></div>
      <div class="key-row"><span class="sub-label" data-i18n="keyMode"></span><button class="link-btn" id="shortcuts-link" data-i18n="keyModeChange"></button></div>
      <div class="key-row"><span class="sub-label" data-i18n="keyFrame"></span><span class="key-fixed" data-i18n="keyFrameVal"></span></div>
      <div class="key-row"><span class="sub-label" data-i18n="keyTurbo"></span><span class="key-fixed" data-i18n="keyTurboVal"></span></div>
      <div class="hint" id="keys-hint" data-i18n="keysHint"></div>
    </div>

    <!-- LAUTSTAERKE -->
    <div class="card">
      <div class="card-header">
        <span class="card-title"><span class="dot dot-pink"></span><span id="boost-title"></span></span>
        <label class="switch">
          <input type="checkbox" id="enable-audio" checked>
          <span class="slider pink"></span>
        </label>
      </div>
      <div class="stage-row">
        <span class="stage-name"><span data-i18n="level"></span> 1</span>
        <input type="range" id="boost-1" min="1" max="24" step="1" value="3">
        <span class="val" id="boost-1-val">+3 dB</span>
      </div>
      <div class="stage-row">
        <span class="stage-name"><span data-i18n="level"></span> 2</span>
        <input type="range" id="boost-2" min="1" max="24" step="1" value="6">
        <span class="val" id="boost-2-val">+6 dB</span>
      </div>
      <div class="stage-row">
        <span class="stage-name"><span data-i18n="level"></span> 3</span>
        <input type="range" id="boost-3" min="1" max="24" step="1" value="9">
        <span class="val" id="boost-3-val">+9 dB</span>
      </div>
      <div class="explain" id="explain-boost"></div>
    </div>

    <!-- LESEN & UEBERSETZEN -->
    <div class="card">
      <div class="card-header">
        <span class="card-title"><span class="dot dot-teal"></span><span data-i18n="readTitle"></span></span>
        <button id="reset-rate" class="pill-btn">Reset 1.35x</button>
      </div>
      <div class="mode-grid">
        <button id="btn-reader" class="mode-btn" data-i18n="modeReader"></button>
        <button id="btn-translator" class="mode-btn" data-i18n="modeOverlay"></button>
        <button id="btn-translator-audio" class="mode-btn" data-i18n="modeAudio"></button>
        <button id="btn-off" class="mode-btn" data-i18n="modeOff"></button>
      </div>
      <div class="row">
        <span class="sub-label" data-i18n="rate"></span>
        <span class="val" id="rate-val">1.35x</span>
      </div>
      <input type="range" id="rate-slider" min="0.80" max="2.20" step="0.05" value="1.35">
      <div class="row">
        <span class="sub-label" data-i18n="ttsOverlay"></span>
        <label class="switch">
          <input type="checkbox" id="tts-translator" checked>
          <span class="slider teal"></span>
        </label>
      </div>
      <div class="row">
        <span class="sub-label" data-i18n="selectBox"></span>
        <label class="switch">
          <input type="checkbox" id="select-box" checked>
          <span class="slider teal"></span>
        </label>
      </div>
      <div class="explain" id="explain-select"></div>
      <div class="explain" data-i18n-html="explainRead"></div>
    </div>

    <!-- MAUSRAD & PFEILE -->
    <div class="card">
      <div class="card-header">
        <span class="card-title"><span class="dot dot-purple"></span><span data-i18n="wheelTitle"></span></span>
        <label class="switch">
          <input type="checkbox" id="enable-wheel" checked>
          <span class="slider purple"></span>
        </label>
      </div>
      <div class="row">
        <span class="sub-label" data-i18n="stepSec"></span>
        <div class="unit-wrap">
          <input type="number" id="wheel-step" min="1" max="120" step="1" value="5">
          <span data-i18n="sec"></span>
        </div>
      </div>
      <div class="slider-block">
        <div class="row">
          <span class="sub-label" data-i18n="ffSlow"></span>
          <span class="val" id="ff-rate-val">3x</span>
        </div>
        <input type="range" class="purple" id="ff-rate" min="1.5" max="10" step="0.5" value="3">
      </div>
      <div class="slider-block">
        <div class="row">
          <span class="sub-label" data-i18n="ffFast"></span>
          <span class="val" id="ff-rate-fast-val">8x</span>
        </div>
        <input type="range" class="purple" id="ff-rate-fast" min="2" max="16" step="0.5" value="8">
      </div>
      <div class="hint" id="ff-hint"></div>
      <div class="explain" id="explain-wheel"></div>
    </div>

    <div class="footer">
      <span id="footer-keys"></span>
      <span class="unit-wrap"><span data-i18n="toasts"></span> <input type="number" id="toast-seconds" min="0.2" max="10" step="0.1" value="0.8"> s</span>
    </div>
    <div class="explain" data-i18n-html="explainToasts"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
